name: release-dispatch

# Canonical operator-facing release orchestrator. zkit is released alone and
# before consumers so go.work cannot hide an unpublished module dependency.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Canonical version (vX.Y.Z or a valid prerelease)
        required: true
        type: string
      scope:
        description: Release scope
        required: true
        type: choice
        default: zarlcode
        options: [zkit, zarlcode, swebench-eval, examples, custom]
      custom_modules:
        description: Comma-separated consumers; zkit must be released alone
        required: false
        type: string
      mode:
        description: Release mode
        required: true
        type: choice
        default: dry-run
        options: [dry-run, publish]

concurrency:
  group: release-dispatch-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: validate release plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      modules: ${{ steps.plan.outputs.modules }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: validate repository and build release plan
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          SCOPE: ${{ inputs.scope }}
          CUSTOM_MODULES: ${{ inputs.custom_modules }}
          MODE: ${{ inputs.mode }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_NAME" != "main" ]; then
            echo "release-dispatch must run from main (got '$REF_NAME')" >&2
            exit 1
          fi
          remote_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ -z "$remote_main" ] || [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "release-dispatch must run at current origin/main ($remote_main), got $GITHUB_SHA" >&2
            exit 1
          fi

          plan_file="$RUNNER_TEMP/release-plan.json"
          go run ./tools/releasecheck/cmd/releasecheck \
            -version "$VERSION" -scope "$SCOPE" \
            -custom-modules "$CUSTOM_MODULES" > "$plan_file"

          mapfile -t tags < <(jq -r '.tags[]' "$plan_file")
          for tag in "${tags[@]}"; do
            if git show-ref --verify --quiet "refs/tags/$tag" || \
               git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "tag already exists: $tag" >&2
              exit 1
            fi
          done

          while IFS=$'\t' read -r consumer path version; do
            [ -n "$path" ] || continue
            echo "verifying $consumer pins published $path@$version"
            GOPROXY=https://proxy.golang.org GOWORK=off go list -m "$path@$version" >/dev/null || {
              echo "$consumer pins unpublished internal module $path@$version" >&2
              exit 1
            }
          done < <(jq -r '.pins[] | [.consumer, .path, .version] | @tsv' "$plan_file")

          modules=$(jq -r '.modules | join(",")' "$plan_file")
          tags_csv=$(jq -r '.tags | join(",")' "$plan_file")
          {
            printf 'version=%s\n' "$VERSION"
            printf 'modules=%s\n' "$modules"
            printf 'tags=%s\n' "$tags_csv"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release plan"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Version: \`$VERSION\`"
            echo "- Mode: \`$MODE\`"
            echo "- Modules: \`$modules\`"
            echo
            echo "### Tags"
            jq -r '.tags[] | "- `" + . + "`"' "$plan_file"
            if [ "$(jq '.pins | length' "$plan_file")" -gt 0 ]; then
              echo
              echo "### Published internal dependency pins"
              jq -r '.pins[] | "- `" + .consumer + "` → `" + .path + "@" + .version + "`"' "$plan_file"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  preflight:
    name: complete release preflight
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: run authoritative release gate
        run: go tool task release-check

      - name: verify selected modules outside the workspace
        env:
          MODULES: ${{ needs.plan.outputs.modules }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a modules <<< "$MODULES"
          for module in "${modules[@]}"; do
            echo "::group::isolated release checks ($module)"
            GOWORK=off go -C "$module" mod verify
            GOWORK=off go build -C "$module" ./...
            GOWORK=off go vet -C "$module" ./...
            GOWORK=off go test -C "$module" -count=1 ./...
            echo "::endgroup::"
          done

      - name: install tmux
        if: ${{ contains(needs.plan.outputs.modules, 'zarlcode') }}
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes tmux
          fi

      - name: exercise releasable zarlcode terminal workflow
        if: ${{ contains(needs.plan.outputs.modules, 'zarlcode') }}
        run: go tool task tui-smoke -- -timeout 45s

      - name: record dry-run completion
        if: ${{ inputs.mode == 'dry-run' }}
        run: echo "dry-run complete; no tags were created" >> "$GITHUB_STEP_SUMMARY"

  publish-tags:
    name: publish annotated tags
    if: ${{ inputs.mode == 'publish' }}
    needs: [plan, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: revalidate main and atomically publish tags
        env:
          TAGS: ${{ needs.plan.outputs.tags }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          remote_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ -z "$remote_main" ] || [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "origin/main moved during preflight; refusing to tag $GITHUB_SHA" >&2
            exit 1
          fi

          IFS=',' read -r -a tags <<< "$TAGS"
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "release plan produced no tags" >&2
            exit 1
          fi
          for tag in "${tags[@]}"; do
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "tag appeared during preflight: $tag" >&2
              exit 1
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in "${tags[@]}"; do
            module="${tag%%/*}"
            git tag -a "$tag" -m "$module $VERSION"
            [ "$(git cat-file -t "$tag")" = tag ]
          done
          git push --atomic origin "${tags[@]}"
          printf '\n## Tags published\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- `%s`\n' "${tags[@]}" >> "$GITHUB_STEP_SUMMARY"

  dispatch-publisher:
    name: dispatch and verify zarlcode publisher
    if: ${{ inputs.mode == 'publish' && contains(needs.plan.outputs.modules, 'zarlcode') }}
    needs: [plan, publish-tags]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: dispatch publisher and wait for completion
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          tag="zarlcode/${VERSION}"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          source_sha=$(git rev-list -n1 "refs/tags/$tag")
          run_started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run release.yml --ref "$tag" -f tag="$tag"

          for attempt in $(seq 1 30); do
            sleep 10
            run_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?per_page=30&event=workflow_dispatch" \
              --jq ".workflow_runs[] | select(.created_at >= \"$run_started\" and .head_sha == \"$source_sha\") | .id" \
              2>/dev/null | head -1 || true)
            if [ -n "$run_id" ]; then
              run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
              echo "publisher run: $run_url" | tee -a "$GITHUB_STEP_SUMMARY"
              gh run watch "$run_id" --exit-status
              exit 0
            fi
            echo "waiting for publisher run ($attempt/30)"
          done
          echo "timed out waiting for release.yml dispatch for $tag" >&2
          exit 1

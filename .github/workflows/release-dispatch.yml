name: release-dispatch

# Canonical operator-facing release orchestrator. zkit is always released before
# consumers so go.work cannot hide an unpublished module dependency.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Canonical version (vX.Y.Z or a valid prerelease)
        required: true
        type: string
      scope:
        description: Release scope
        required: true
        type: choice
        default: zarlcode
        options: [zkit, zarlcode, swebench-eval, examples, custom]
      custom_modules:
        description: Comma-separated consumers; zkit must be released alone
        required: false
        type: string
      mode:
        description: Release mode
        required: true
        type: choice
        default: dry-run
        options: [dry-run, publish]

concurrency:
  group: release-dispatch-main
  cancel-in-progress: false

permissions:
  contents: write
  # GITHUB_TOKEN tag pushes do not trigger workflows, so dispatch the publisher.
  actions: write

jobs:
  plan-and-release:
    name: release plan / publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: validate repository and build release plan
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          SCOPE: ${{ inputs.scope }}
          CUSTOM_MODULES: ${{ inputs.custom_modules }}
          MODE: ${{ inputs.mode }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_NAME" != "main" ]; then
            echo "release-dispatch must run from main (got '$REF_NAME')" >&2
            exit 1
          fi
          remote_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ -z "$remote_main" ] || [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "release-dispatch must run at current origin/main ($remote_main), got $GITHUB_SHA" >&2
            exit 1
          fi

          plan_file="$RUNNER_TEMP/release-plan.json"
          go run ./tools/releasecheck/cmd/releasecheck \
            -version "$VERSION" -scope "$SCOPE" \
            -custom-modules "$CUSTOM_MODULES" > "$plan_file"

          mapfile -t tags < <(jq -r '.tags[]' "$plan_file")
          for tag in "${tags[@]}"; do
            if git show-ref --verify --quiet "refs/tags/$tag" || \
               git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "tag already exists: $tag" >&2
              exit 1
            fi
          done

          while IFS=$'\t' read -r consumer path version; do
            [ -n "$path" ] || continue
            echo "verifying $consumer pins published $path@$version"
            GOPROXY=https://proxy.golang.org GOWORK=off go list -m "$path@$version" >/dev/null || {
              echo "$consumer pins unpublished internal module $path@$version" >&2
              exit 1
            }
          done < <(jq -r '.pins[] | [.consumer, .path, .version] | @tsv' "$plan_file")

          modules=$(jq -r '.modules | join(",")' "$plan_file")
          tags_csv=$(jq -r '.tags | join(",")' "$plan_file")
          {
            printf 'version=%s\n' "$VERSION"
            printf 'modules=%s\n' "$modules"
            printf 'tags=%s\n' "$tags_csv"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release plan"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Version: \`$VERSION\`"
            echo "- Mode: \`$MODE\`"
            echo "- Modules: \`$modules\`"
            echo
            echo "### Tags"
            jq -r '.tags[] | "- `" + . + "`"' "$plan_file"
            if [ "$(jq '.pins | length' "$plan_file")" -gt 0 ]; then
              echo
              echo "### Published internal dependency pins"
              jq -r '.pins[] | "- `" + .consumer + "` → `" + .path + "@" + .version + "`"' "$plan_file"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: preflight build, vet, test, and lint
        env:
          MODULES: ${{ steps.plan.outputs.modules }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a modules <<< "$MODULES"
          for module in "${modules[@]}"; do
            echo "::group::release checks ($module)"
            GOWORK=off go mod verify -C "$module"
            go build -C "$module" ./...
            go vet -C "$module" ./...
            go test -C "$module" -count=1 ./...
            go tool github.com/golangci/golangci-lint/v2/cmd/golangci-lint run "./$module/..."
            echo "::endgroup::"
          done

      - name: stop after dry-run
        if: ${{ inputs.mode == 'dry-run' }}
        run: echo "dry-run complete; no tags were created"

      - name: create and push annotated tags
        if: ${{ inputs.mode == 'publish' }}
        env:
          TAGS: ${{ steps.plan.outputs.tags }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          IFS=',' read -r -a tags <<< "$TAGS"
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "release plan produced no tags" >&2
            exit 1
          fi
          for tag in "${tags[@]}"; do
            module="${tag%%/*}"
            git tag -a "$tag" -m "$module $VERSION"
            [ "$(git cat-file -t "$tag")" = tag ] || exit 1
          done
          git push origin "${tags[@]}"
          printf '\n## Tags published\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- `%s`\n' "${tags[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: dispatch and verify zarlcode publisher
        if: ${{ inputs.mode == 'publish' && contains(steps.plan.outputs.modules, 'zarlcode') }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          tag="zarlcode/${VERSION}"
          dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          run_started=$(date -u -d "$dispatched_at - 5 seconds" +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run release.yml --ref main -f tag="$tag"
          for attempt in $(seq 1 30); do
            sleep 10
            source_sha=$(git rev-list -n1 "refs/tags/$tag")
            run_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?per_page=30&event=workflow_dispatch" \
              --jq ".workflow_runs[] | select(.created_at >= \"$run_started\" and .head_sha == \"$source_sha\" and .display_title == \"release\") | .id" \
              2>/dev/null | head -1 || true)
            if [ -n "$run_id" ]; then
              run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
              echo "publisher run: $run_url" | tee -a "$GITHUB_STEP_SUMMARY"
              gh run watch "$run_id" --exit-status
              exit 0
            fi
            echo "waiting for publisher run ($attempt/30)"
          done
          echo "timed out waiting for release.yml dispatch for $tag" >&2
          exit 1

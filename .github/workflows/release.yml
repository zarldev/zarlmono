name: release

# Publishes zarlcode from an existing annotated zarlcode/vX.Y.Z tag. Manual
# dispatch is the recovery path when publication infrastructure fails.
on:
  push:
    tags: ["zarlcode/v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated zarlcode tag, e.g. zarlcode/v0.16.0
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GOWORK: "off"

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: validate tagged source
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^zarlcode/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$ ]]; then
            echo "invalid zarlcode release tag: $TAG" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$TAG^{tag}" >/dev/null
          test "$(git rev-list -n1 "$TAG")" = "$(git rev-parse HEAD)"
          go run ./tools/releasecheck/cmd/releasecheck \
            -version "${TAG#zarlcode/}" -scope zarlcode >/tmp/release-plan.json
          while IFS=$'\t' read -r path version; do
            GOPROXY=https://proxy.golang.org go list -m "$path@$version" >/dev/null
          done < <(jq -r '.pins[] | [.path, .version] | @tsv' /tmp/release-plan.json)
      - name: build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${TAG#zarlcode/}"
          ldflags="-s -w -X github.com/zarldev/zarlmono/zarlcode/version.version=${version}"
          package_dir="dist/package"
          mkdir -p "$package_dir"
          go build -C zarlcode -trimpath -ldflags "$ldflags" \
            -o "$GITHUB_WORKSPACE/$package_dir/zarlcode" ./cmd
          archive="zarlcode_${version}_${GOOS}_${GOARCH}.tar.gz"
          tar -C "$package_dir" -czf "dist/$archive" zarlcode
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          test "$(tar -tzf "dist/$archive")" = zarlcode
      - name: upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: zarlcode-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    env:
      HOMEBREW_APP_ID: ${{ secrets.HOMEBREW_APP_ID }}
      HOMEBREW_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
      HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: validate tagged source
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/$TAG^{tag}" >/dev/null
          test "$(git rev-list -n1 "$TAG")" = "$(git rev-parse HEAD)"
      - name: download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: validate artifacts and assemble checksums
        run: |
          set -euo pipefail
          cd artifacts
          version="${TAG#zarlcode/}"
          expected=(
            "zarlcode_${version}_darwin_amd64.tar.gz"
            "zarlcode_${version}_darwin_arm64.tar.gz"
            "zarlcode_${version}_linux_amd64.tar.gz"
            "zarlcode_${version}_linux_arm64.tar.gz"
          )
          mapfile -t archives < <(printf '%s\n' *.tar.gz | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${archives[@]}")
          for archive in "${archives[@]}"; do
            test -f "$archive.sha256"
            test "$(tar -tzf "$archive")" = zarlcode
            grep -Fx "$(sha256sum "$archive")" "$archive.sha256" >/dev/null
          done
          cat ./*.sha256 | sort -k2 > checksums.txt
          test "$(wc -l < checksums.txt)" -eq 4
          test "$(awk '{print $2}' checksums.txt | sort -u | wc -l)" -eq 4
          rm ./*.sha256

          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          tar -xzf "zarlcode_${version}_linux_amd64.tar.gz" -C "$tmpdir"
          test "$("$tmpdir/zarlcode" -version)" = "$version"
      - name: attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            artifacts/*.tar.gz
      - name: publish github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_names=$(printf '%s\n' artifacts/*.tar.gz artifacts/checksums.txt | xargs -n1 basename | sort)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            actual_names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | sort)
            unexpected=$(comm -13 <(printf '%s\n' "$expected_names") <(printf '%s\n' "$actual_names"))
            if [ -n "$unexpected" ]; then
              echo "existing release contains unexpected assets:" >&2
              echo "$unexpected" >&2
              exit 1
            fi
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              artifacts/*.tar.gz artifacts/checksums.txt
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "zarlcode ${TAG#zarlcode/}" --generate-notes \
              artifacts/*.tar.gz artifacts/checksums.txt
          fi
          body=$(awk -v heading="## [$TAG]" '
            index($0, heading) == 1 { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md)
          if [ -z "${body//[[:space:]]/}" ]; then
            echo "missing changelog body for $TAG" >&2
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$body"
          release_url=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          printf '## GitHub release\n\n- %s\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
      - name: verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$tmpdir"
          diff -u artifacts/checksums.txt "$tmpdir/checksums.txt"
          version="${TAG#zarlcode/}"
          expected=$(printf '%s\n' \
            checksums.txt \
            "zarlcode_${version}_darwin_amd64.tar.gz" \
            "zarlcode_${version}_darwin_arm64.tar.gz" \
            "zarlcode_${version}_linux_amd64.tar.gz" \
            "zarlcode_${version}_linux_arm64.tar.gz" | sort)
          actual=$(find "$tmpdir" -maxdepth 1 -type f -printf '%f\n' | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          (cd "$tmpdir" && sha256sum -c checksums.txt)
          for archive in "$tmpdir"/*.tar.gz; do
            test "$(tar -tzf "$archive")" = zarlcode
          done
          tar -xzf "$tmpdir/zarlcode_${version}_linux_amd64.tar.gz" -C "$tmpdir"
          test "$("$tmpdir/zarlcode" -version)" = "$version"
      - name: generate homebrew formula
        run: |
          set -euo pipefail
          go run ./tools/genformula/cmd/genformula \
            --version "${TAG#zarlcode/}" \
            --checksums artifacts/checksums.txt \
            --output homebrew/zarlcode.rb
      - name: create homebrew tap app token
        id: homebrew-app-token
        if: ${{ env.HOMEBREW_APP_ID != '' && env.HOMEBREW_APP_PRIVATE_KEY != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: zarldev
          repositories: homebrew-tap
      - name: update homebrew tap with app token
        id: update-homebrew-tap-app
        if: ${{ steps.homebrew-app-token.outcome == 'success' && steps.homebrew-app-token.outputs.token != '' }}
        continue-on-error: true
        env:
          TAP_TOKEN: ${{ steps.homebrew-app-token.outputs.token }}
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/zarldev/homebrew-tap.git" "$tmpdir"
          mkdir -p "$tmpdir/Formula"
          cp homebrew/zarlcode.rb "$tmpdir/Formula/zarlcode.rb"
          git -C "$tmpdir" diff --quiet -- Formula/zarlcode.rb && exit 0
          git -C "$tmpdir" config user.name "github-actions[bot]"
          git -C "$tmpdir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tmpdir" add Formula/zarlcode.rb
          git -C "$tmpdir" commit -m "zarlcode ${TAG#zarlcode/}"
          git -C "$tmpdir" push
      - name: update homebrew tap with deploy key
        id: update-homebrew-tap-key
        if: ${{ steps.update-homebrew-tap-app.outcome != 'success' && env.HOMEBREW_TAP_SSH_KEY != '' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          keyfile="$tmpdir/tap_key"
          trap 'rm -rf "$tmpdir"' EXIT
          printf '%s\n' "$HOMEBREW_TAP_SSH_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          export GIT_SSH_COMMAND="ssh -i $keyfile -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:zarldev/homebrew-tap.git "$tmpdir/tap"
          mkdir -p "$tmpdir/tap/Formula"
          cp homebrew/zarlcode.rb "$tmpdir/tap/Formula/zarlcode.rb"
          git -C "$tmpdir/tap" diff --quiet -- Formula/zarlcode.rb && exit 0
          git -C "$tmpdir/tap" config user.name "github-actions[bot]"
          git -C "$tmpdir/tap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tmpdir/tap" add Formula/zarlcode.rb
          git -C "$tmpdir/tap" commit -m "zarlcode ${TAG#zarlcode/}"
          git -C "$tmpdir/tap" push
      - name: verify homebrew tap publication
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.update-homebrew-tap-app.outcome }}" != "success" ] && \
             [ "${{ steps.update-homebrew-tap-key.outcome }}" != "success" ]; then
            echo "neither Homebrew publication path succeeded" >&2
            exit 1
          fi
          set -euo pipefail
          for attempt in $(seq 1 30); do
            gh api repos/zarldev/homebrew-tap/contents/Formula/zarlcode.rb \
              --jq .content | base64 -d > "$RUNNER_TEMP/remote-zarlcode.rb"
            if cmp -s homebrew/zarlcode.rb "$RUNNER_TEMP/remote-zarlcode.rb"; then
              printf '\n## Homebrew\n\n- tap formula matches the generated release formula\n' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo "Homebrew tap formula does not match this release" >&2
          echo "app outcome: ${{ steps.update-homebrew-tap-app.outcome }}" >&2
          echo "key outcome: ${{ steps.update-homebrew-tap-key.outcome }}" >&2
          exit 1

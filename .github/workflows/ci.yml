name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# This is a go.work multi-module repo. `./...` only expands within the
# *current* module, so a single root `go build ./...` silently covers
# only whatever packages live in the root module. Every job below therefore
# runs per module via a matrix. The root module is tooling-only; examples live
# in their own module.

jobs:
  build-test:
    name: build vet test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ["examples", "zkit", "zarlcode", "swebench-eval"]
    steps:
      - uses: actions/checkout@v6

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        working-directory: ${{ matrix.module }}
        run: go build ./...
        if: matrix.module != 'zarlcode'
      - name: build (zarlcode)
        working-directory: ${{ matrix.module }}
        run: go list ./... | grep -v '/cmd$' | xargs go build
        if: matrix.module == 'zarlcode'

      - name: vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: test
        working-directory: ${{ matrix.module }}
        run: go test -count=1 ./...

  race-test:
    name: race test (zkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # zkit holds the concurrent core (agent, messagebus, zsync, mcp). Race
      # the whole module rather than a hand-curated subtree list that silently
      # loses coverage every time a new concurrent package is added.
      - name: race test
        working-directory: zkit
        run: go test -race -count=1 ./...

  test-policy:
    name: test policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: reject new same-package tests and Background test contexts
        env:
          TEST_POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-new-test-policy.sh "$TEST_POLICY_BASE"

  lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ["examples", "zkit", "zarlcode", "swebench-eval"]
    steps:
      - uses: actions/checkout@v6

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: ${{ matrix.module }}

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# go.work tests the current sibling modules together. Each matrix member first
# verifies its own committed module graph with workspace replacements disabled,
# then builds, vets, and tests the current workspace graph.
jobs:
  build-test:
    name: module (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: ["examples", "zkit", "zarlcode", "swebench-eval"]
    steps:
      - uses: actions/checkout@v7

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: verify standalone module graph
        env:
          GOWORK: "off"
        run: go -C "${{ matrix.module }}" mod verify

      - name: build through workspace
        run: go build -C "${{ matrix.module }}" ./...

      - name: vet through workspace
        run: go vet -C "${{ matrix.module }}" ./...

      - name: test through workspace
        run: go test -C "${{ matrix.module }}" -count=1 ./...

  repository-tools:
    name: repository tools and policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: vet repository tools
        run: go vet ./tools/...

      - name: test repository tools
        run: go test -count=1 ./tools/...

      - name: select test-source policy base
        id: test-policy-base
        env:
          TEST_POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$TEST_POLICY_BASE"
          # A new branch has no previous commit. Audit the full tree rather
          # than skip policy checks or pass GitHub's all-zero SHA to git diff.
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base=$(git hash-object -t tree -w --stdin </dev/null)
          fi
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: enforce test-source policy
        env:
          TEST_POLICY_BASE: ${{ steps.test-policy-base.outputs.base }}
        run: go run ./tools/testpolicy/cmd/testpolicy "$TEST_POLICY_BASE"

  tui-smoke:
    name: tui golden workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: install tmux
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes tmux
          fi

      - name: exercise onboarding, restart, and cancellation workflow
        run: go tool task tui-smoke -- -timeout 45s

  race-test:
    name: race test (zkit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # zkit owns the concurrent core; race the whole module so new packages do
      # not silently fall outside a hand-maintained package list.
      - name: race test
        run: go tool task race:zkit

  application-race-test:
    name: race test (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: ["zarlcode", "swebench-eval"]
    steps:
      - uses: actions/checkout@v7

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Application owners coordinate turns, UI events, durable writes, and
      # evaluation workers beyond the shared runner's lifecycle.
      - name: race test
        run: go tool task race:${{ matrix.module }}

  lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [".", "examples", "zkit", "zarlcode", "swebench-eval"]
    steps:
      - uses: actions/checkout@v7

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: ${{ matrix.module }}

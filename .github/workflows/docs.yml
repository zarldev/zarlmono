name: docs

on:
  pull_request:
    paths:
      - 'site/**'
      - 'tools/doccheck/**'
      - 'examples/quickstart/**'
      - '*.md'
      - '**/*.md'
      - '**/*.mdx'
      - 'Taskfile.yml'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/doccheck/**'
      - 'examples/quickstart/**'
      - '*.md'
      - '**/*.md'
      - '**/*.mdx'
      - 'Taskfile.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: verify and build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: verify sources and build site
        run: go tool task docs:check

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

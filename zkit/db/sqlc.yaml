# Regenerate generated code with `sqlc generate` (sqlc v1.31.1) after changing
# queries/ or migrations/. The gen/ directory is committed.
version: "2"
sql:
  - engine: "sqlite"
    queries: "queries/"
    schema: "migrations/"
    gen:
      go:
        package: "gen"
        out: "gen"
        emit_empty_slices: true
        emit_json_tags: false
        emit_interface: false
        emit_exact_table_names: false
        emit_prepared_queries: false

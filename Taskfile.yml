version: '3'

vars:
  BIN_DIR:
    sh: 'printf "%s" "${BIN_DIR:-$HOME/.local/bin}"'
  ZARLCODE: '{{.BIN_DIR}}/zarlcode'
  SWEEVAL: '{{.BIN_DIR}}/sweeval'
  ZARLCODE_VERSION:
    sh: 'printf "%s+%s" "$(git describe --tags --match "zarlcode/v*" --dirty --always 2>/dev/null | sed "s#^zarlcode/##" || echo dev)" "$(date -u +%Y%m%d-%H%M%S)"'
  SWEEVAL_VERSION:
    sh: git describe --tags --always --dirty --match 'swebench-eval/v*' | sed 's#^swebench-eval/##'

tasks:
  release-check:
    desc: Run the complete module-isolated local pre-release gate
    cmds:
      - go test -count=1 ./tools/releasecheck/... ./tools/genformula/...
      - task: dependency-pair
      - |
        for m in examples zkit zarlcode swebench-eval; do
          echo "==> isolated dependency check ($m)"
          GOWORK=off go mod verify -C "$m"
        done
        # Build/test the working tree through go.work. Consumer go.mod files pin
        # the last published sibling APIs until the next dependency-ordered release.
        for m in examples zkit zarlcode swebench-eval; do
          echo "==> workspace build/vet/test ($m)"
          go build -C "$m" ./...
          go vet -C "$m" ./...
          go test -C "$m" -count=1 ./...
        done
      - task: lint
      - GOWORK=off go test -C zkit -race -count=1 ./...
      - npm --prefix site ci
      - npm --prefix site run build
      - npm --prefix site audit --audit-level=high
      - GOTOOLCHAIN=go1.27.0 GOWORK=off go test -C zkit -run '^$' ./...
  default:
    desc: Show available tasks
    cmds:
      - go tool task --list


  help:
    desc: Show available tasks
    cmds:
      - go tool task --list


  tui-smoke:
    desc: Run the bounded PTY-backed interactive TUI smoke (requires tmux)
    cmds:
      - bash scripts/tui-smoke.sh
  # --- repo-wide Go workflow (CI-covered modules) ---

  build:
    desc: Build CI-covered Go modules
    cmds:
      - |
        for m in examples zkit zarlcode swebench-eval; do
          echo "==> go build ($m)"
          go build -C "$m" ./...
        done

  vet:
    desc: Vet CI-covered Go modules
    cmds:
      - |
        for m in examples zkit zarlcode swebench-eval; do
          echo "==> go vet ($m)"
          go vet -C "$m" ./...
        done

  test:
    desc: Test CI-covered Go modules
    cmds:
      - |
        for m in examples zkit zarlcode swebench-eval; do
          echo "==> go test ($m)"
          go test -C "$m" -count=1 ./...
        done

  test-policy:
    desc: Reject new same-package tests and Background contexts in tests
    cmds:
      - bash scripts/check-new-test-policy.sh "${TEST_POLICY_BASE:-HEAD}"

  dependency-pair:
    desc: Verify the validated Anthropic and JSON Schema dependency pair
    cmds:
      - bash scripts/check-anthropic-jsonschema-pair.sh

  check:
    desc: Build, vet, and test CI-covered Go modules
    cmds:
      - task: build
      - task: vet
      - task: test
      - task: test-policy
      - task: dependency-pair

  lint:
    desc: Run golangci-lint for CI-covered Go modules
    cmds:
      - |
        for m in examples zkit zarlcode swebench-eval; do
          echo "==> golangci-lint ($m)"
          go tool github.com/golangci/golangci-lint/v2/cmd/golangci-lint run "./$m/..."
        done

  race:
    desc: Run zkit race tests
    cmds:
      - go test -C zkit -race -count=1 ./...

  # --- foundations / reusable building blocks ---

  foundation:test:
    desc: Test core zkit building blocks
    cmds:
      - go test -C zkit -count=1 ./agent/runner/... ./agent/harness ./agent/coderunner ./agent/guardrails ./ai/tools/...

  runner:test:
    desc: Test the canonical agent runner
    cmds:
      - go test -C zkit -count=1 ./agent/runner/...

  harness:test:
    desc: Test the deterministic harness and shared coding loop
    cmds:
      - go test -C zkit -count=1 ./agent/harness ./agent/coderunner

  llm:test:
    desc: Test LLM provider packages
    cmds:
      - go test -C zkit -count=1 ./ai/llm/...

  tools:test:
    desc: Test AI tool packages
    cmds:
      - go test -C zkit -count=1 ./ai/tools/...

  # --- zarlcode ---

  zarlcode:
    desc: Build and install the zarlcode TUI
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOAMD64="${GOAMD64:-v3}" go build -trimpath -ldflags='-s -w -X github.com/zarldev/zarlmono/zarlcode/version.version={{.ZARLCODE_VERSION}}' -o {{.ZARLCODE}} ./zarlcode/cmd
      - echo "installed{{":"}} {{.ZARLCODE}} (version {{.ZARLCODE_VERSION}})"

  zarlcode:install:
    desc: Alias for zarlcode
    cmds:
      - task: zarlcode

  zarlcode:run:
    desc: Run zarlcode from source
    cmds:
      - go run ./zarlcode/cmd

  zarlcode:clean:
    desc: Remove the installed zarlcode binary
    cmds:
      - rm -f {{.ZARLCODE}}
      - echo "removed{{":"}} {{.ZARLCODE}}"

  zarlcode:release:
    desc: Emergency zarlcode tag path; prefer GitHub Actions release-dispatch
    cmds:
      - |
        set -euo pipefail
        version="{{.VERSION}}"
        go run ./tools/releasecheck/cmd/releasecheck \
          -version "$version" -scope zarlcode >/tmp/zarlcode-release-plan.json
        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "working tree has uncommitted changes; commit before releasing" >&2
          exit 1
        fi
        branch=$(git branch --show-current)
        remote_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
        if [ "$branch" != main ] || [ "$remote_main" != "$(git rev-parse HEAD)" ]; then
          echo "manual release requires the current origin/main tip" >&2
          exit 1
        fi
        tag="zarlcode/$version"
        if git show-ref --verify --quiet "refs/tags/$tag" || \
           git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
          echo "tag already exists: $tag" >&2
          exit 1
        fi
        zkit_version=$(jq -r '.pins[] | select(.module == "zkit") | .version' /tmp/zarlcode-release-plan.json)
        GOPROXY=https://proxy.golang.org GOWORK=off \
          go list -m "github.com/zarldev/zarlmono/zkit@$zkit_version" >/dev/null
        go tool task release-check
        git tag -a "$tag" -m "zarlcode $version"
        test "$(git cat-file -t "$tag")" = tag
        git push origin "$tag"
        echo "pushed release tag: $tag"
    requires:
      vars: [VERSION]
  # --- SWE-bench eval tool ---

  sweeval:
    desc: Build and install the SWE-bench eval tool
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -C swebench-eval -trimpath -ldflags="-s -w -X github.com/zarldev/zarlmono/swebench-eval/version.version={{.SWEEVAL_VERSION}}" -o {{.SWEEVAL}} ./cmd/eval
      - echo "installed{{":"}} {{.SWEEVAL}}"
  sweeval:install:
    desc: Alias for sweeval
    cmds:
      - task: sweeval

  swebench-eval:
    desc: Alias for sweeval
    cmds:
      - task: sweeval

  sweeval:test:
    desc: Test the SWE-bench eval module
    cmds:
      - go test -C swebench-eval -count=1 ./...

  sweeval:clean:
    desc: Remove the installed sweeval binary
    cmds:
      - rm -f {{.SWEEVAL}}
      - echo "removed{{":"}} {{.SWEEVAL}}"

  # --- small deterministic harness examples ---

  examples:build:
    desc: Build all examples
    cmds:
      - go build -C examples ./...

  examples:test:
    desc: Test all examples
    cmds:
      - go test -C examples -count=1 ./...

  example:healthcheck:
    desc: Run the deterministic healthcheck harness demo
    cmds:
      - go run -C examples ./healthcheck -scripted

  example:releasegate:
    desc: Run the deterministic releasegate harness demo
    cmds:
      - go run -C examples ./releasegate -scripted

  example:hnupvote:test:
    desc: Test the HN upvote harness without live browser/account state
    cmds:
      - go test -C examples -count=1 ./hnupvote/

  # --- docs site ---

  docs:dev:
    desc: Start docs site dev server
    cmds:
      - npm --prefix site run dev

  docs:build:
    desc: Build docs site for production
    cmds:
      - npm --prefix site run build

  docs:preview:
    desc: Preview the built docs site
    cmds:
      - npm --prefix site run preview
